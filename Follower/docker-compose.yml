version: "3.9"

services:
  follower-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: follower_service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=followers123
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - follower-net
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j_followers
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/followers123
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
      - NEO4J_dbms_security_procedures_unrestricted=*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-conf:/conf
    networks:
      - follower-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p followers123 'MATCH (n) RETURN count(n);'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

networks:
  follower-net:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-conf: