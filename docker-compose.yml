version: '3.9'

services:

  #common:
    #build:
      #context: ./common
      #dockerfile: Dockerfile
    #image: local/common   # daj mu ime, lokalno
  # --- Stakeholders ---
  stakeholders-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: super
      POSTGRES_DB: Stakeholders
    ports:
      - "5433:5432"
    volumes:
      - stakeholders-pgdata:/var/lib/postgresql/data
    networks:
      - app-network
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  stakeholders-backend:
    build:
      context: ./Stakeholders
    ports:
      - "8080:8080"
    environment:
      DB_HOST: stakeholders-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: super
      DB_NAME: Stakeholders
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      stakeholders-db:
        condition: service_healthy
    networks:
      - app-network
      - monitoring

  # --- Tours ---
  tours-mongo:
    image: mongo:6
    ports:
      - "27019:27017"
    volumes:
      - tours-mongo-data:/data/db
      - ./Tours/logs:/var/log/tours-backend
    networks:
      - tours-net
      - monitoring

  tours-backend:
    build:
      context: ./Tours
    ports:
      - "8081:8081"
    environment:
      MONGO_URI: mongodb://tours-mongo:27017
      MONGO_DB: Tours
      MONGO_COLLECTION: Tours
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      - tours-mongo
      - jaeger
    networks:
      - tours-net
      - monitoring

  # --- Blog ---
  blog-mongo:
    image: mongo:6
    ports:
      - "27018:27017"
    volumes:
      - blog-mongo-data:/data/db
    networks:
      - blogs-net
      - monitoring

  blog-backend:
    build:
      context: .
      dockerfile: Blog/Dockerfile
    ports:
      - "8082:8082"
      - "50051:50051"
    environment:
      MONGO_URI: mongodb://blog-mongo:27017
      MONGO_DB: Blogs
      MONGO_COLLECTION: Blogs
      FOLLOWER_SERVICE_URL: http://follower-service:8083
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
      NATS_URL: nats://nats:4222
    depends_on:
      - blog-mongo
      - nats
      #- common
    networks:
      - blogs-net
      - follower-net
      - monitoring

   # --- NATS ---
  nats:
    image: nats:2.10
    ports:
      - "4222:4222"   # default client port
      - "8222:8222"   # monitoring UI http://localhost:8222
    networks:
      - blogs-net
      - follower-net
      - monitoring
  # --- Followers ---
  neo4j:
    image: neo4j:5.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/followers123
    volumes:
      - neo4j-data:/data
    networks:
      - follower-net
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p followers123 'MATCH (n) RETURN count(n);'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  follower-service:
    build:
      context: .
      dockerfile: Follower/Dockerfile
    ports:
      - "8083:8083"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: followers123
      NATS_URL: nats://nats:4222
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      neo4j:
          condition:  service_healthy
      - nats
    networks:
      - follower-net
      - monitoring   
   

  # --- Purchase ---
  purchase-db:
    image: mongo:6
    container_name: purchase-db
    ports:
      - "27020:27017"
    volumes:
      - purchase-mongo-data:/data/db
    networks:
      - purchase-network
      - monitoring

  purchase-service:
    build:
      context: ./Purchase
    ports:
      - "8084:5000"
    environment:
      MONGO_URI: mongodb://purchase-db:27017/purchase
    depends_on:
      - purchase-db
    networks:
      - purchase-network
      - monitoring

  # --- Gateway ---
  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "8070:8070"
    environment:
      JAEGER_ENDPOINT: http://jaeger:14268/api/traces
    depends_on:
      - stakeholders-backend
      - tours-backend
      - blog-backend
      - follower-service
      - purchase-service
    networks:
      - app-network
      - tours-net
      - blogs-net
      - follower-net
      - monitoring
      - purchase-network

  # --- Monitoring stack (grafana/loki/jaeger/prometheus) ---

  jaeger:
    image: jaegertracing/all-in-one:1.34
    ports:
      - "9000:16686" # WEB UI
      - "14268:14268" # HTTP collector
      - "6831:6831/udp"   # UDP agent
      - "6832:6832/udp"   # UDP agent
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - monitoring

  loki:
    image: grafana/loki:main-5206e3a
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks: 
      - monitoring
    

  grafana:
    image: grafana/grafana:8.5.3
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_PATHS_DASHBOARDS=/var/lib/grafana/dashboards
    networks:
      - monitoring
      - app-network
      - tours-net
      - blogs-net
      - follower-net
      - purchase-network

  renderer:
    image: grafana/grafana-image-renderer:3.10.5
    environment:
      ENABLE_METRICS: "true"
    networks:
      - monitoring

  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:main
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    volumes:
      - ./monitoring/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    depends_on:
      - loki
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.35.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
       - '--config.file=/etc/prometheus/prometheus.yml'
       - '--storage.tsdb.path=/prometheus'
       - '--web.console.libraries=/etc/prometheus/console_libraries'
       - '--web.console.templates=/etc/prometheus/consoles'
       - '--storage.tsdb.retention.time=200h'
       - '--web.enable-lifecycle'
    networks:
      - monitoring
      - app-network
      - tours-net
      - blogs-net
      - follower-net
      - purchase-network

  node-exporter:
    image: prom/node-exporter:v1.1.2
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    ports:
      - "8089:8080"
    volumes:
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys:/sys:ro
      - /var/run:/var/run:rw
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - monitoring

volumes:
  stakeholders-pgdata:
  tours-mongo-data:
  blog-mongo-data:
  neo4j-data:
  grafana:
  loki-data:
  prometheus-data:
  purchase-mongo-data:


networks:
  app-network:
    driver: bridge
  tours-net:
    driver: bridge
  blogs-net:
    driver: bridge
  follower-net:
    driver: bridge
  monitoring:
    driver: bridge
  purchase-network:
    driver: bridge
