[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name forward
    Listen 0.0.0.0
    Port 24224

[OUTPUT]
    Name grafana-loki
    Match *
    Url ${LOKI_URL}
    Labels {job="microservices", service="fluent-bit"}
    BatchWait 1s
    BatchSize 1001024
    LineFormat json
    LogLevel info
    LabelKeys container_name,container_id,tag
