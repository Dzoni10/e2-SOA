<form [formGroup]="blogCreationForm" (ngSubmit)="create()">
    <div class="form-container">
        <mat-form-field>
            <mat-label>Blog Title</mat-label>
            <input matInput formControlName="title" type="text"/>
        </mat-form-field>
        
        <mat-form-field>
            <mat-label>Content (Markdown supported)</mat-label>
            <textarea matInput formControlName="description" 
                      rows="8" 
                      placeholder="Write your blog content here. You can use markdown formatting like **bold** and # headers">
            </textarea>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Images (URLs)</mat-label>
            <mat-chip-grid #imageChipGrid aria-label="Enter image URLs">
                <mat-chip-row *ngFor="let imageUrl of templateImages()" (removed)="removeImage(imageUrl)">
                    {{imageUrl}}
                    <button matChipRemove class="image">
                        <mat-icon>cancel</mat-icon>
                    </button>
                </mat-chip-row>
            </mat-chip-grid>
            <input placeholder="Add image URL (press enter)..."
                   [matChipInputFor]="imageChipGrid"
                   (matChipInputTokenEnd)="addImage($event)"
            />
        </mat-form-field>

        <button class="add-update" color="primary" type="submit" mat-raised-button>Create Blog</button>
    </div>
</form>
