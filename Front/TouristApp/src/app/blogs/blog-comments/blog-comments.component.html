<div class="comments">
  <h3>Comments</h3>

  <div *ngIf="comments.length === 0">
    <p>No comments yet.</p>
  </div>

  <div *ngFor="let comment of comments" class="comment-card">
    <strong>{{ comment.username }}</strong>
    <p>{{ comment.text }}</p>
    <small>Created: {{ comment.createdAt | date:'short' }}</small>
    <span *ngIf="comment.updatedAt && comment.updatedAt !== comment.createdAt">
      (Edited: {{ comment.updatedAt | date:'short' }})
    </span>
    <hr>
  </div>

  <div class="add-comment">
    <textarea [(ngModel)]="newCommentText" placeholder="Write a comment..."></textarea>
    <button (click)="addComment()">Post</button>
  </div>
</div>
