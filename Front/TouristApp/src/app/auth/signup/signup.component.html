<form [formGroup]="signupForm" (ngSubmit)="register()">
    <div class="form-container">
        <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" type="text"/>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Surname</mat-label>
            <input matInput formControlName="surname" type="text"/>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" type="text"/>
        </mat-form-field>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password"/>
        </mat-form-field>
        <mat-form-field>
    <mat-label>Role</mat-label>
    <mat-select formControlName="role" required>
      <mat-option [value]="1">Tourist</mat-option>
      <mat-option [value]="2">Guide</mat-option>
    </mat-select>
  </mat-form-field>

    <button color="primary" type="submit" mat-raised-button>Register</button>
    </div>
</form>
